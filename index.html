<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Applications of Trigonometry — Interactive</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#faf9f6;--grid:#e8e6e1;--grid-maj:#d4d1c9;
  --sf:rgba(255,255,255,.96);--s2:#ffffff;--bd:#d8d5cd;
  --tx:#1c1917;--t2:#57534e;--ac:#1d4ed8;--g:#15803d;--w:#b45309;
  --pk:#be123c;--pu:#7c3aed;--rd:#dc2626;--sky:#eef6fc;
  --r:8px;--f:'Source Serif 4',Georgia,serif;--mo:'IBM Plex Mono',monospace;
}
html,body{height:100%;overflow:hidden;font-family:var(--f);background:var(--paper);color:var(--tx)}
body{background-image:
  linear-gradient(var(--grid) 1px,transparent 1px),
  linear-gradient(90deg,var(--grid) 1px,transparent 1px),
  linear-gradient(var(--grid-maj) 1px,transparent 1px),
  linear-gradient(90deg,var(--grid-maj) 1px,transparent 1px);
background-size:12px 12px,12px 12px,60px 60px,60px 60px}
#app{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:.55rem 1.4rem;background:var(--sf);border-bottom:1px solid var(--bd);flex-shrink:0;backdrop-filter:blur(10px)}
header h1{font-size:1.05rem;font-family:var(--mo);color:var(--tx);font-weight:700;letter-spacing:-.02em}
header span{font-size:.72rem;color:var(--t2);font-weight:400;font-family:var(--f)}
.tabs{display:flex;gap:3px;padding:.35rem .8rem;background:var(--sf);border-bottom:1px solid var(--bd);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:.45rem .85rem;font-size:.68rem;border:1px solid transparent;background:0;color:var(--t2);cursor:pointer;border-radius:var(--r);white-space:nowrap;font-family:var(--mo);font-weight:600;transition:.15s}
.tab:hover{color:var(--tx);background:var(--s2);border-color:var(--bd)}
.tab.a{color:var(--ac);background:#fff;border-color:#bfdbfe;box-shadow:0 1px 2px rgba(29,78,216,.08)}
.mn{display:flex;flex:1;overflow:hidden}
.lt{width:58%;height:100%;display:flex;align-items:center;justify-content:center;padding:.8rem;position:relative;overflow:hidden}
.rt{width:42%;height:100%;padding:1rem 1.1rem;border-left:1px solid var(--bd);display:flex;flex-direction:column;gap:.75rem;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--bd) transparent;background:rgba(255,255,255,.72)}
.rt h2{font-size:1.05rem;color:var(--tx);font-family:var(--mo);font-weight:700;line-height:1.2;margin-bottom:.1rem}
.rt p{font-size:.82rem;color:var(--t2);line-height:1.55;font-weight:400}
.rt h2+p{margin-top:-.2rem}
canvas{border-radius:var(--r);background:var(--s2);touch-action:none;border:1px solid var(--bd);box-shadow:0 2px 8px rgba(28,25,23,.06),inset 0 0 0 1px rgba(255,255,255,.8);max-width:100%;max-height:100%;object-fit:contain}
.ct{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:.2rem 0}
.ct label{font-size:.72rem;color:var(--t2);font-family:var(--mo);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.ct input[type=range]{width:120px;accent-color:var(--ac);cursor:pointer;height:5px}
.b{padding:6px 12px;border:1px solid var(--bd);background:#fff;color:var(--tx);border-radius:var(--r);cursor:pointer;font-size:.75rem;font-family:var(--mo);font-weight:600;transition:.12s}
.b:hover{border-color:var(--ac);color:var(--ac)}.b.on{background:var(--ac);color:#fff;border-color:var(--ac)}.b:disabled{opacity:.35;cursor:default}
.fm{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:.75rem .9rem;font-family:var(--mo);font-size:.78rem;color:var(--w);line-height:1.75;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.fm .katex{font-size:1.05em}.vl{color:var(--g);font-weight:700}
.sec{display:none;width:100%;height:100%}.sec.vis{display:flex}
.ni{width:58px;padding:4px 6px;background:#fff;border:1.5px solid var(--bd);color:var(--ac);font-family:var(--mo);font-size:.78rem;border-radius:6px;text-align:center;outline:0;font-weight:700}
.ni:focus{border-color:var(--ac);box-shadow:0 0 0 2px rgba(29,78,216,.12)}
.hint{font-size:.72rem;color:var(--t2);font-style:italic;line-height:1.4}
.legend{display:flex;flex-wrap:wrap;gap:.5rem .9rem;font-size:.68rem;color:var(--t2);font-family:var(--mo)}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-right:3px}
@media(max-width:768px){.mn{flex-direction:column}.lt{width:100%;height:46%}.rt{width:100%;height:54%;border-left:0;border-top:1px solid var(--bd)}}
</style>
</head>
<body>
<div id="app">
<header><h1>Applications of Trigonometry</h1><span>Class X · Chapter 12 · SCERT Telangana</span></header>
<div class="tabs" id="tB"></div>
<div class="mn" id="mA"></div>
</div>
<script>
function K(t){try{return katex.renderToString(t,{throwOnError:false})}catch(e){return t}}
function KD(t){try{return katex.renderToString(t,{throwOnError:false,displayMode:true})}catch(e){return t}}
const T=[
  {i:'el',l:'① Elevation'},{i:'dp',l:'② Depression'},{i:'tw',l:'③ Clock Tower'},
  {i:'pl',l:'④ Electric Pole'},{i:'hl',l:'⑤ Helicopter'},{i:'tt',l:'⑥ Two △'},
  {i:'bl',l:'⑦ Balloon'},{i:'rf',l:'⑧ Reference'}
];
let at='el',aR={};
const PI=Math.PI,Dg=r=>r*180/PI,Rd=d=>d*PI/180;
function F(v,n){n=n??2;return Math.abs(v)<1e-4?'0':(+v).toFixed(n)}
function cl(v,a,b){return Math.max(a,Math.min(b,v))}

function init(){
  const b=document.getElementById('tB'),m=document.getElementById('mA');
  T.forEach(t=>{
    const n=document.createElement('button');n.className='tab'+(t.i===at?' a':'');n.textContent=t.l;
    n.onclick=()=>sw(t.i);n.id='t_'+t.i;b.appendChild(n);
    const s=document.createElement('div');s.className='sec'+(t.i===at?' vis':'');s.id='s_'+t.i;m.appendChild(s);
  });
  buildAll();window.addEventListener('resize',buildAll);
}
function sw(i){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('a'));
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('vis'));
  document.getElementById('t_'+i).classList.add('a');
  document.getElementById('s_'+i).classList.add('vis');
  at=i;Object.keys(aR).forEach(k=>{cancelAnimationFrame(aR[k]);delete aR[k]});
  buildAll();
}
function mL(s){if(s.querySelector('.lt'))return;s.innerHTML='<div class="lt"></div><div class="rt"></div>'}
function gC(s,id){
  let c=s.querySelector('#'+id);
  if(!c){c=document.createElement('canvas');c.id=id;s.querySelector('.lt').appendChild(c)}
  const r=s.querySelector('.lt').getBoundingClientRect();
  const z=Math.min(r.width,r.height,window.innerHeight*0.55)*0.88;
  c.width=z*2;c.height=z*2;
  c.style.width=z+'px';c.style.height=z+'px';
  return c;
}
function sA(si,ii,cb,mn,mx){
  const s=document.getElementById(si),p=document.getElementById(ii);
  function g(v){v=cl(Math.round(v*10)/10,mn,mx);s.value=v;p.value=v;cb(v)}
  s.oninput=()=>g(+s.value);p.onchange=()=>g(+p.value);p.onkeydown=e=>{if(e.key==='Enter')g(+p.value)};
  return g;
}

/* ─── Canvas helpers: graph paper + realistic objects ─── */
function drawPaperGrid(g,W,H){
  g.fillStyle='#faf9f6';g.fillRect(0,0,W,H);
  const step=W/40;
  g.strokeStyle='#eceae4';g.lineWidth=1;
  for(let x=0;x<=W;x+=step){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}
  for(let y=0;y<=H;y+=step){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
  g.strokeStyle='#ddd9d0';g.lineWidth=1.2;
  for(let x=0;x<=W;x+=step*5){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}
  for(let y=0;y<=H;y+=step*5){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
}
function drawSkyGround(g,W,H,gy,ratio){
  ratio=ratio??0.72;
  const skyH=gy;
  const gr= g.createLinearGradient(0,0,0,skyH);
  gr.addColorStop(0,'#e8f4fc');gr.addColorStop(1,'#f5f9fc');
  g.fillStyle=gr;g.fillRect(0,0,W,skyH);
  const gg=g.createLinearGradient(0,gy,0,H);
  gg.addColorStop(0,'#c4a574');gg.addColorStop(0.15,'#b8956a');gg.addColorStop(1,'#a6845c');
  g.fillRect(0,gy,W,H-gy);
  g.strokeStyle='#8b6914';g.lineWidth=2;
  g.beginPath();g.moveTo(0,gy);g.lineTo(W,gy);g.stroke();
  // grass texture
  g.strokeStyle='rgba(90,120,60,.25)';g.lineWidth=1;
  for(let i=0;i<W;i+=stepRand(i,14,22)){
    const x=i+((i*7)%5);g.beginPath();g.moveTo(x,gy);g.lineTo(x+2,gy-4-Math.sin(i)*2);g.stroke();
  }
}
function stepRand(i,a,b){return a+(i*13)%((b-a)||1)}

function drawDimH(g,x1,x2,y,label,color){
  color=color||'#7c3aed';
  g.strokeStyle=color;g.fillStyle=color;g.lineWidth=1.2;
  g.beginPath();g.moveTo(x1,y);g.lineTo(x2,y);g.stroke();
  [[x1,y],[x2,y]].forEach(([x,y])=>{
    g.beginPath();g.moveTo(x,y-5);g.lineTo(x,y+5);g.stroke();
  });
  g.font='700 '+(g._fs||14)+'px "IBM Plex Mono"';g.textAlign='center';
  g.fillText(label,(x1+x2)/2,y+16);g.textAlign='left';
}
function drawDimV(g,x,y1,y2,label,color){
  color=color||'#7c3aed';
  g.strokeStyle=color;g.fillStyle=color;g.lineWidth=1.2;
  g.beginPath();g.moveTo(x,y1);g.lineTo(x,y2);g.stroke();
  [[x,y1],[x,y2]].forEach(([x,y])=>{
    g.beginPath();g.moveTo(x-5,y);g.lineTo(x+5,y);g.stroke();
  });
  g.save();g.translate(x+14,(y1+y2)/2);g.rotate(-PI/2);
  g.font='700 '+(g._fs||14)+'px "IBM Plex Mono"';g.textAlign='center';
  g.fillText(label,0,0);g.restore();
}
function drawAngleArc(g,cx,cy,r,aDeg,label){
  const th=Rd(aDeg);
  g.fillStyle='rgba(220,38,38,.12)';g.beginPath();g.moveTo(cx,cy);
  g.arc(cx,cy,r,0,-th,true);g.closePath();g.fill();
  g.strokeStyle='#dc2626';g.lineWidth=2;
  g.beginPath();g.arc(cx,cy,r,0,-th,true);g.stroke();
  const mid=-th/2,lx=cx+(r+18)*Math.cos(mid),ly=cy+(r+18)*Math.sin(mid);
  g.fillStyle='#dc2626';g.font='700 '+(g._fs||14)+'px "IBM Plex Mono"';g.textAlign='center';
  g.fillText(label,lx,ly+4);g.textAlign='left';
}
function drawHoriz(g,x1,x2,y){
  g.strokeStyle='#64748b';g.lineWidth=1.5;g.setLineDash([5,4]);
  g.beginPath();g.moveTo(x1,y);g.lineTo(x2,y);g.stroke();g.setLineDash([]);
}
function drawSight(g,x1,y1,x2,y2){
  g.strokeStyle='#2563eb';g.lineWidth=2.2;g.setLineDash([7,5]);
  g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.setLineDash([]);
  // arrowhead
  const ang=Math.atan2(y2-y1,x2-x1),sz=10;
  g.fillStyle='#2563eb';g.beginPath();
  g.moveTo(x2,y2);g.lineTo(x2-sz*Math.cos(ang-.35),y2-sz*Math.sin(ang-.35));
  g.lineTo(x2-sz*Math.cos(ang+.35),y2-sz*Math.sin(ang+.35));g.closePath();g.fill();
}

function drawPerson(g,x,footY,sc){
  sc=sc||1;const h=32*sc;
  g.save();g.shadowColor='rgba(0,0,0,.18)';g.shadowBlur=4;g.shadowOffsetY=2;
  g.fillStyle='rgba(0,0,0,.1)';g.beginPath();g.ellipse(x,footY-2,10*sc,3*sc,0,0,PI*2);g.fill();
  g.shadowBlur=0;
  // legs
  g.strokeStyle='#334155';g.lineWidth=3*sc;g.lineCap='round';
  g.beginPath();g.moveTo(x-4*sc,footY);g.lineTo(x-4*sc,footY-14*sc);g.stroke();
  g.beginPath();g.moveTo(x+4*sc,footY);g.lineTo(x+4*sc,footY-14*sc);g.stroke();
  // torso
  g.fillStyle='#475569';g.fillRect(x-7*sc,footY-h+14*sc,14*sc,16*sc);
  // arms
  g.strokeStyle='#334155';g.lineWidth=2.5*sc;
  g.beginPath();g.moveTo(x-7*sc,footY-h+18*sc);g.lineTo(x-16*sc,footY-h+26*sc);g.stroke();
  g.beginPath();g.moveTo(x+7*sc,footY-h+18*sc);g.lineTo(x+16*sc,footY-h+26*sc);g.stroke();
  // head
  g.fillStyle='#fcd9b6';g.beginPath();g.arc(x,footY-h+8*sc,7*sc,0,PI*2);g.fill();
  g.fillStyle='#1e293b';g.beginPath();g.arc(x-2*sc,footY-h+7*sc,1.2*sc,0,PI*2);g.fill();
  g.beginPath();g.arc(x+2*sc,footY-h+7*sc,1.2*sc,0,PI*2);g.fill();
  g.restore();
}

function drawPalmTree(g,x,gy,hPx){
  g.save();g.shadowColor='rgba(0,0,0,.2)';g.shadowBlur=6;g.shadowOffsetY=3;
  const trunkH=hPx*0.55,topY=gy-trunkH- hPx*0.12;
  const tg=g.createLinearGradient(x-6,gy-trunkH,x+6,gy);
  tg.addColorStop(0,'#9a7b2a');tg.addColorStop(1,'#6b4f12');
  g.fillStyle=tg;g.beginPath();g.roundRect(x-6,gy-trunkH,12,trunkH,3);g.fill();
  // fronds
  for(let i=0;i<7;i++){
    const fy=topY+i*(hPx*0.07),len=38-i*3;
    g.strokeStyle=i%2?'#2d6a4f':'#40916c';g.lineWidth=2.8;g.lineCap='round';
    g.beginPath();g.moveTo(x,fy);
    g.quadraticCurveTo(x-len,fy+6,x-len-8,fy+20);g.stroke();
    g.beginPath();g.moveTo(x,fy);
    g.quadraticCurveTo(x+len,fy+6,x+len+8,fy+20);g.stroke();
  }
  g.fillStyle='#52b788';g.beginPath();g.arc(x,topY,5,0,PI*2);g.fill();
  g.restore();
}

function drawClockTower(g,x,gy,hPx){
  g.save();g.shadowColor='rgba(0,0,0,.15)';g.shadowBlur=8;g.shadowOffsetY=4;
  const w=42,topY=gy-hPx;
  const bg=g.createLinearGradient(x-w/2,topY,x+w/2,gy);
  bg.addColorStop(0,'#f1f5f9');bg.addColorStop(1,'#cbd5e1');
  g.fillStyle=bg;g.fillRect(x-w/2,topY,w,hPx);
  g.strokeStyle='#94a3b8';g.lineWidth=1.5;g.strokeRect(x-w/2,topY,w,hPx);
  for(let row=0;row<Math.floor(hPx/28);row++){
    for(let col=0;col<2;col++){
      g.fillStyle='rgba(191,219,254,.85)';g.fillRect(x-w/2+8+col*18,topY+14+row*28,10,14);
      g.strokeStyle='#94a3b8';g.strokeRect(x-w/2+8+col*18,topY+14+row*28,10,14);
    }
  }
  g.fillStyle='#64748b';g.beginPath();
  g.moveTo(x,topY-10);g.lineTo(x-w/2-5,topY+6);g.lineTo(x+w/2+5,topY+6);g.closePath();g.fill();
  g.fillStyle='#fff';g.beginPath();g.arc(x,topY+22,16,0,PI*2);g.fill();
  g.strokeStyle='#475569';g.lineWidth=2;g.stroke();
  g.strokeStyle='#1e293b';g.lineWidth=1.8;g.lineCap='round';
  g.beginPath();g.moveTo(x,topY+22);g.lineTo(x,topY+14);g.stroke();
  g.beginPath();g.moveTo(x,topY+22);g.lineTo(x+8,topY+24);g.stroke();
  g.restore();
}

function drawElectricPole(g,x,gy,hPx){
  g.save();g.shadowBlur=5;g.shadowColor='rgba(0,0,0,.2)';
  const tg=g.createLinearGradient(x-5,gy-hPx,x+5,gy);
  tg.addColorStop(0,'#64748b');tg.addColorStop(1,'#334155');
  g.fillStyle=tg;g.fillRect(x-5,gy-hPx,10,hPx);
  g.strokeStyle='#1e293b';g.lineWidth=2;
  g.beginPath();g.moveTo(x-32,gy-hPx+18);g.lineTo(x+32,gy-hPx+18);g.stroke();
  g.beginPath();g.moveTo(x-26,gy-hPx+36);g.lineTo(x+26,gy-hPx+36);g.stroke();
  g.fillStyle='#fbbf24';g.beginPath();g.arc(x,gy-hPx,4,0,PI*2);g.fill();
  g.strokeStyle='#64748b';g.lineWidth=1;
  g.beginPath();g.moveTo(x-18,gy-hPx+18);g.quadraticCurveTo(x,gy-hPx-2,x+18,gy-hPx+18);g.stroke();
  g.restore();
}

function drawSchool(g,x,gy,hPx){
  g.save();g.shadowBlur=8;g.shadowColor='rgba(0,0,0,.12)';
  const w=78,topY=gy-hPx;
  g.fillStyle='#fef3c7';g.fillRect(x-w/2,topY,w,hPx);
  g.strokeStyle='#d97706';g.lineWidth=1.5;g.strokeRect(x-w/2,topY,w,hPx);
  for(let r=0;r<3;r++)for(let c=0;c<4;c++){
    g.fillStyle='#fde68a';g.fillRect(x-w/2+10+c*16,topY+12+r*24,11,16);
    g.strokeStyle='#b45309';g.lineWidth=.8;g.strokeRect(x-w/2+10+c*16,topY+12+r*24,11,16);
  }
  g.fillStyle='#92400e';g.fillRect(x-14,gy-32,28,32);
  g.fillStyle='#57534e';g.font='600 '+(g._fs||12)+'px "Source Serif 4"';g.textAlign='center';
  g.fillText('School',x,topY-8);g.textAlign='left';
  g.restore();
}

function drawBorewell(g,x,gy){
  g.save();g.shadowBlur=4;g.shadowColor='rgba(0,0,0,.15)';
  g.fillStyle='#6b7280';g.beginPath();g.roundRect(x-16,gy-26,32,26,4);g.fill();
  g.fillStyle='#374151';g.fillRect(x-12,gy-22,24,10);
  g.strokeStyle='#9ca3af';g.lineWidth=2;g.beginPath();g.arc(x,gy-8,6,0,PI*2);g.stroke();
  g.fillStyle='#57534e';g.font='600 '+(g._fs||11)+'px "Source Serif 4"';g.textAlign='center';
  g.fillText('Borewell',x,gy+14);g.textAlign='left';
  g.restore();
}

function drawHelicopter(g,x,y){
  g.save();g.shadowBlur=6;g.shadowColor='rgba(0,0,0,.2)';
  g.fillStyle='rgba(0,0,0,.12)';g.beginPath();g.ellipse(x,y+10,38,7,0,0,PI*2);g.fill();
  const bg=g.createLinearGradient(x-30,y-12,x+30,y+12);
  bg.addColorStop(0,'#3b82f6');bg.addColorStop(1,'#1d4ed8');
  g.fillStyle=bg;g.beginPath();g.ellipse(x,y,30,13,0,0,PI*2);g.fill();
  g.fillStyle='rgba(147,197,253,.9)';g.fillRect(x-10,y-8,20,12);
  g.strokeStyle='#64748b';g.lineWidth=2.5;
  g.beginPath();g.moveTo(x-38,y-2);g.lineTo(x+38,y-2);g.stroke();
  g.beginPath();g.moveTo(x,y-2);g.lineTo(x,y-20);g.stroke();
  g.fillStyle='#475569';g.beginPath();g.moveTo(x-38,y-2);g.lineTo(x-46,y-6);g.lineTo(x-38,y-6);g.closePath();g.fill();
  g.beginPath();g.moveTo(x+38,y-2);g.lineTo(x+46,y-6);g.lineTo(x+38,y-6);g.closePath();g.fill();
  g.fillStyle='#1e40af';g.beginPath();g.moveTo(x-26,y+11);g.lineTo(x+26,y+11);g.lineTo(x+18,y+18);g.lineTo(x-18,y+18);g.closePath();g.fill();
  g.restore();
}

function drawBalloon(g,x,y){
  g.save();g.shadowBlur=5;g.shadowColor='rgba(0,0,0,.15)';
  const rg=g.createRadialGradient(x-6,y-8,2,x,y,28);
  rg.addColorStop(0,'#f87171');rg.addColorStop(1,'#b91c1c');
  g.fillStyle=rg;g.beginPath();g.ellipse(x,y,22,28,0,0,PI*2);g.fill();

function bindCanvasDrag(c,getPt,setPt,onUp){
  let drag=false;
  const toC=e=>{
    const r=c.getBoundingClientRect();
    const ex=e.touches?e.touches[0].clientX:e.clientX;
    const ey=e.touches?e.touches[0].clientY:e.clientY;
    return {x:(ex-r.left)/r.width*c.width,y:(ey-r.top)/r.height*c.height};
  };
  const start=e=>{drag=true;const p=toC(e);setPt(getPt(p));e.preventDefault()};
  const move=e=>{if(!drag)return;setPt(getPt(toC(e)))};
  const end=()=>{if(drag&&onUp)onUp();drag=false};
  c.addEventListener('mousedown',start);c.addEventListener('mousemove',move);
  window.addEventListener('mouseup',end);
  c.addEventListener('touchstart',start,{passive:false});
  c.addEventListener('touchmove',move,{passive:false});
  c.addEventListener('touchend',end);
}

    </table>
  </div>`;
  sec.querySelector('.rt').innerHTML=`
